<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Autentificare — Facultatea de Informatică UVT</title>
    <link rel="stylesheet" href="../CSS/style.css">
    <link rel="stylesheet" href="../CSS/login_style.css">
</head>
<body>
    <div class="login-wrapper">
        <div class="login-container">
            <!-- Partea stângă: Sigla Facultății de Informatică -->
            <div class="login-image">
                <img src="../MEDIA/login.png" alt="Facultatea de Informatică UVT">
            </div>

            <div class="separator"></div>

            <!-- Partea dreaptă: Formularul de autentificare -->
            <div class="login-form">
                <h2>Autentificare</h2>
                <p class="subtitle">Comunitatea de Tehnologii Web</p>
                
                <form action="home.html" method="get">
                    <div class="input-group">
                        <input type="email" placeholder="Adresă Email (ex: student@e-uvt.ro)" required>
                    </div>
                    <div class="input-group">
                        <input type="password" placeholder="Parolă" required>
                    </div>
                    <button type="submit" class="btn-login">Conectare</button>
                </form>

                <p class="register-text">
                    Nu ai cont? <a href="register.html">Înregistrează-te</a>
                </p>
            </div>
        </div>
    </div>
</body>
</html>
